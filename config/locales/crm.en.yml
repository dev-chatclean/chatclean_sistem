en:
  crm:
    stages:
      errors:
        duplicate_name: There is already a stage called %{name} in this pipeline.
        system_stage_delete: System stages (New contact, Won and Lost) are required and cannot be deleted.
        invalid_transfer_stage: Choose another open stage of this pipeline to receive the deals.
        invalid_order: The new order must include every open stage and keep New contact first.
      defaults:
        initial: New contact
        won: Won
        lost: Lost
    pipelines:
      errors:
        invalid_card_fields: Choose at most %{max} valid card items.
        default_cannot_be_unset: The default pipeline cannot be turned off. Set another pipeline as the default instead.
        default_cannot_be_deleted: The default pipeline cannot be deleted. Set another pipeline as the default before deleting it.
    settings:
      errors:
        ai_requires_monthly_cap: Set a monthly spending cap above zero to turn on the pipeline AI.
        auto_create_requires_default_pipeline: Automatic deal creation needs a default pipeline. Create a pipeline first.
