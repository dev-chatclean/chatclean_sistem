en:
  chatclean:
    schedule:
      errors:
        seven_days: must have the seven days of the week
        closed_and_open: a day cannot be "Closed" and "Open 24h" at the same time
        close_before_open: closing must be after opening
        follows_account: This inbox follows the account business hours. Change them in Settings → Business hours and holidays.
    holidays:
      default_message: Today is a holiday. Our service is paused and we will be back on the next business day.
      national:
        new_year: New Year's Day
        tiradentes: Tiradentes Day
        labour_day: Labour Day
        independence: Independence Day
        aparecida: Our Lady of Aparecida
        all_souls: All Souls' Day
        republic: Republic Day
        black_consciousness: Black Consciousness Day
        christmas: Christmas
        good_friday: Good Friday
    canned_responses:
      attachments_too_large: The attachments exceed 16 MB in total
    closing:
      reason_required: Choose a closing reason. If there are none, ask an administrator to add one.
      invalid_sale_value: Enter the sale value, with no negative amounts
      deal_title: "%{reason} — conversation #%{id}"
    conversations:
      already_accepted: "This conversation was already accepted by %{name}"
      transfer:
        target_required: Choose a team or an agent to transfer to
        no_inbox_access: The agent has no access to the inbox of this conversation
    super_admin:
      date_format: "%b %-d, %Y"
      sidebar:
        collapse: Collapse menu
        toggle: Collapse or expand the menu
      language:
        label: Language
        en: English
        pt_BR: Português (Brasil)
      dashboard:
        accounts: Accounts
        users: Users
        inboxes: Inboxes
        conversations: Conversations
        chart_caption: Created per day over the last 30 days
        chart_aria_label: Conversations created by day
        load_error: Could not load the dashboard stats. Reload the page to try again.
        total: Total
        daily_average: Daily average
        busiest_day: Busiest day
  activerecord:
    attributes:
      crm/deal:
        # Aparece no início das mensagens de erro do deal (ex.: contato bloqueado).
        crm_contact: Contact
  crm:
    stages:
      default_names:
        won: Won
        lost: Lost
    loss_reasons:
      contact_blocked: Contact blocked
  errors:
    crm:
      different_account: must belong to the same account
      pipeline:
        has_deals: This pipeline has deals. Move them to another pipeline before deleting it.
        invalid_stage_order: The new order must list every open stage of this pipeline exactly once.
      loss_reason:
        system_reason_active: cannot be turned off because automations use this reason
      stage:
        has_deals: This stage has deals. Move them to another stage before deleting it.
        single_closing_stage: already exists in this pipeline. Each pipeline has one won and one lost stage.
        closing_stage_immutable: The won and lost stages keep their status and probability. Only the name can change.
        closing_stage_undeletable: The won and lost stages cannot be deleted. Delete the pipeline instead.
      deal:
        loss_reason_required: is required when the deal is lost
        inactive_loss_reason: is inactive. Choose an active loss reason.
        blocked_contact: is blocked and cannot receive new deals
        blocked_contact_locked: is blocked, so this deal stays lost until the contact is unblocked
        blocked_contact_assignee_locked: is blocked, so this deal's assignee cannot change until the contact is unblocked
        conversation_readonly: cannot be changed once the deal has an origin conversation
        conversation_other_contact: belongs to a different contact than the deal
