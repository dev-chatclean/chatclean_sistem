AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ChatClean V2 em produção, máquina única em sa-east-1 (CCV2-19). EC2 com Docker e Caddy,
  Elastic IP, firewall só com 80/443, acesso por SSM (sem SSH), ECR e a role de deploy do
  GitHub Actions por OIDC (CCV2-20). Buckets de anexos e de backup, snapshots diários e o
  tópico de alertas (CCV2-21). E-mail pelo SES, alarmes do CloudWatch e orçamento (CCV2-22).
  Aplicado por .chatclean/infra/deploy-base.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 LTS x86. O deploy-base resolve na criação e mantém nas atualizações:
      um AMI novo recriaria a máquina.
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge]
  RootVolumeSize:
    Type: Number
    Default: 50
    MinValue: 50
  GitHubRepository:
    Type: String
    Default: dev-chatclean/chatclean_sistem
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: false quando a conta já tem o provedor OIDC do GitHub.
  AlertEmail:
    Type: String
    Default: desenvolvimento@chatclean.com.br
    Description: Recebe os alertas (falha de backup, alarmes e orçamento).
  MailDomain:
    Type: String
    Default: chatclean.com.br
    Description: Domínio do remetente dos e-mails (SES).
  MonthlyBudget:
    Type: Number
    Default: 150
    Description: Teto mensal em dólares; alerta em 80% e 100% do gasto e na previsão de 100%.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, 'true']

Resources:
  # Firewall: só HTTP e HTTPS. Sem porta 22 (o terminal é pelo SSM Session Manager) e sem as
  # portas do Postgres e do Redis, que nem saem dos containers.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ChatClean - HTTP e HTTPS publicos
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redireciona para HTTPS e desafio ACME) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags: [{ Key: Name, Value: chatclean-web }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chatclean-instance
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: chatclean-production-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chatclean/production
        # Anexos (Active Storage, sem chave fixa: o SDK usa esta role) e envio dos backups.
        - PolicyName: chatclean-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AttachmentsBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${AttachmentsBucket.Arn}/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${BackupsBucket.Arn}/database/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      DisableApiTermination: true
      # IMDSv2 obrigatório; 2 saltos para os containers (rails e sidekiq usam a role para o S3).
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            # O banco e o Redis moram neste disco: ele sobrevive se a máquina for encerrada.
            DeleteOnTermination: false
      Tags: [{ Key: Name, Value: chatclean-production }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Preparação da máquina (CCV2-19). Roda no primeiro boot de cada máquina, inclusive de uma
          # recriada a partir de um snapshot (CCV2-21), por isso pode encontrar tudo já feito.
          # Log em /var/log/cloud-init-output.log.
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Swap de 4 GB contra picos de memória.
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Recomendações do Redis.
          printf 'net.core.somaxconn = 1024\nvm.overcommit_memory = 1\n' > /etc/sysctl.d/90-chatclean.conf
          sysctl --system

          # Docker Engine e Compose pelo repositório oficial.
          apt-get update
          apt-get install -y ca-certificates curl unzip
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          systemctl enable --now docker

          # AWS CLI v2 (ECR e Parameter Store no deploy).
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --update
          rm -rf /tmp/aws /tmp/awscliv2.zip

          # O AMI Ubuntu traz o SSM Agent (snap); garante que sobe no boot.
          snap start --enable amazon-ssm-agent

          # Pasta do deploy; os arquivos vêm da imagem a cada release (ver .chatclean/deploy).
          install -m 0700 -d /opt/chatclean

          # CloudWatch Agent (CCV2-22): memória e disco da máquina, e o log de acesso do Caddy
          # (logs/caddy, montado no container) para o alarme de erros 5xx.
          curl -fsSL https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb \
            -o /tmp/amazon-cloudwatch-agent.deb
          dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
          rm -f /tmp/amazon-cloudwatch-agent.deb
          cat > /opt/aws/amazon-cloudwatch-agent/etc/chatclean.json <<'JSON'
          {
            "agent": { "run_as_user": "root" },
            "metrics": {
              "namespace": "ChatClean",
              "append_dimensions": { "InstanceId": "${aws:InstanceId}" },
              "aggregation_dimensions": [["InstanceId"]],
              "metrics_collected": {
                "mem": { "measurement": ["mem_used_percent"] },
                "disk": { "resources": ["/"], "measurement": ["used_percent"], "drop_device": true }
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    { "file_path": "/opt/chatclean/logs/caddy/access.log", "log_group_name": "/chatclean/caddy",
                      "log_stream_name": "{instance_id}", "retention_in_days": 30 }
                  ]
                }
              }
            }
          }
          JSON
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/chatclean.json

  ElasticIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: chatclean-production }]

  # Anexos das conversas. Privado; o Rails entrega por URL pré-assinada de validade curta.
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub chatclean-attachments-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # Dumps diários do banco (backup-db.sh), apagados depois de 30 dias.
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub chatclean-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expira-dumps
            Status: Enabled
            Prefix: database/
            ExpirationInDays: 30

  # Snapshot diário do disco da máquina às 03:30 de Brasília, guardando os 7 últimos.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chatclean-snapshots
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: ChatClean - snapshot diario do disco, 7 dias
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [INSTANCE]
        TargetTags: [{ Key: Name, Value: chatclean-production }]
        Schedules:
          - Name: diario
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ['06:30'] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # Alertas por e-mail. A assinatura precisa ser confirmada no link que a AWS manda.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: chatclean-alerts
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }

  # E-mail transacional (CCV2-22). O domínio é verificado por DKIM (3 CNAMEs) e o MAIL FROM
  # bounce.<domínio> tem SPF próprio, então o SPF da raiz (e-mail da Hostinger) não muda.
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref MailDomain
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }
      MailFromAttributes:
        MailFromDomain: !Sub bounce.${MailDomain}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # Usuário só para as credenciais SMTP do SES, a única chave fixa do sistema (o Chatwoot envia
  # por SMTP). A chave é criada pelo ses-smtp-credentials direto no Parameter Store.
  SmtpUser:
    Type: AWS::IAM::User
    Properties:
      UserName: chatclean-ses-smtp
      Policies:
        - PolicyName: chatclean-ses-send
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomain}

  # Log de acesso do Caddy, enviado pelo CloudWatch Agent. Tem IP e URL de quem acessa: 30 dias.
  CaddyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /chatclean/caddy
      RetentionInDays: 30

  Http5xxMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CaddyLogGroup
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - { MetricNamespace: ChatClean, MetricName: Http5xx, MetricValue: '1', DefaultValue: 0 }

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-http-5xx
      AlarmDescription: Mais de 20 respostas 5xx em 5 minutos
      Namespace: ChatClean
      MetricName: Http5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-cpu
      AlarmDescription: CPU acima de 85% por 10 minutos
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-memoria
      AlarmDescription: Memória acima de 90% por 10 minutos
      Namespace: ChatClean
      MetricName: mem_used_percent
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-disco
      AlarmDescription: Disco acima de 80%
      Namespace: ChatClean
      MetricName: disk_used_percent
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Falha do hardware da AWS: a máquina é recuperada em outro host, com o mesmo disco e IP.
  SystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-maquina-recuperada
      AlarmDescription: Falha no host da AWS; a máquina foi recuperada automaticamente
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Sub arn:aws:automate:${AWS::Region}:ec2:recover
        - !Ref AlertsTopic

  # Falha dentro da máquina (sistema travado, sem memória): alerta para alguém olhar.
  InstanceCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-maquina-sem-resposta
      AlarmDescription: A máquina não responde à verificação de status da AWS
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Gasto bruto, sem descontar os créditos: mostra o consumo real mesmo com a conta coberta.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: chatclean-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudget, Unit: USD }
        CostTypes: { IncludeCredit: false, IncludeRefund: false }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: chatclean
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Guarda as 20 imagens mais recentes",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 20},
            "action": {"type": "expire"}}]}

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Role que o workflow chatclean-deploy.yml assume, só a partir de pushes na main.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chatclean-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: chatclean-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'

Outputs:
  InstanceId:
    Description: Variável CHATCLEAN_INSTANCE_ID do GitHub
    Value: !Ref Instance
  PublicIp:
    Description: Registro A de chat.chatclean.com.br na Hostinger
    Value: !Ref ElasticIp
  DeployRoleArn:
    Description: Variável AWS_DEPLOY_ROLE_ARN do GitHub
    Value: !GetAtt DeployRole.Arn
  ImageRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  AttachmentsBucketName:
    Description: Parâmetro S3_BUCKET_NAME em /chatclean/production
    Value: !Ref AttachmentsBucket
  BackupsBucketName:
    Value: !Ref BackupsBucket
  DkimRecord1:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName1} -> ${MailIdentity.DkimDNSTokenValue1}
  DkimRecord2:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName2} -> ${MailIdentity.DkimDNSTokenValue2}
  DkimRecord3:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName3} -> ${MailIdentity.DkimDNSTokenValue3}
