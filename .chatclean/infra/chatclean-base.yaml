AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ChatClean em produção (CCV2-39), no Norte da Virgínia (us-east-1): a arquitetura de referência
  do Chatwoot na AWS reduzida a uma zona. VPC com uma sub-rede pública, uma EC2 instalada pelo
  install.sh oficial do Chatwoot (nginx, Postgres, Redis, web e Sidekiq na máquina), IP fixo,
  firewall só com 80/443 e acesso por SSM.
  Anexos e backups no S3, snapshots diários, e-mail pelo SES, alarmes e orçamento.
  Referência: a infraestrutura foi criada em 28/10/2026 pelo console e pela AWS CLI com esta
  configuração e estes nomes, sem stack.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 LTS x86. Um AMI novo recriaria a máquina.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, c5.xlarge]
  RootVolumeSize:
    Type: Number
    Default: 60
    MinValue: 60
    Description: A documentação do Chatwoot pede 60 GB.
  AlertEmail:
    Type: String
    Default: desenvolvimento@chatclean.com.br
    Description: Recebe os alertas (falha de backup, alarmes e orçamento).
  MailDomain:
    Type: String
    Default: chatclean.com.br
    Description: Domínio do remetente dos e-mails (SES).
  MonthlyBudget:
    Type: Number
    Default: 150
    Description: Teto mensal em dólares; alerta em 80% e 100% do gasto e na previsão de 100%.

Resources:
  # Rede da documentação do Chatwoot, só com a zona A e a sub-rede pública: sem sub-rede privada,
  # a máquina não precisa de NAT e sai para a internet pelo próprio IP fixo.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: chatclean-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: chatclean-igw }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: chatclean-public-1 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: chatclean-public-rt }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Firewall: só HTTP (Let's Encrypt e redirecionamento) e HTTPS do nginx. Sem porta 22 (o terminal
  # é pelo SSM Session Manager) e sem 3000, 5432 e 6379, que só escutam dentro da máquina.
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ChatClean - HTTP e HTTPS publicos
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redireciona para HTTPS e desafio ACME) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags: [{ Key: Name, Value: chatclean-web }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chatclean-instance
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        # Credenciais SMTP que o setup copia para o .env do Chatwoot.
        - PolicyName: chatclean-production-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/chatclean/production
        # Anexos (Active Storage, sem chave fixa: o SDK usa esta role), envio dos backups e leitura
        # dos scripts e logos que o push-ops publica em ops/.
        - PolicyName: chatclean-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AttachmentsBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${AttachmentsBucket.Arn}/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${BackupsBucket.Arn}/database/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupsBucket.Arn
                Condition: { StringLike: { s3:prefix: ['ops/*'] } }
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${BackupsBucket.Arn}/ops/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      DisableApiTermination: true
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            # O banco e o Redis moram neste disco: ele sobrevive se a máquina for encerrada.
            DeleteOnTermination: false
      Tags: [{ Key: Name, Value: chatclean-production }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # Preparação da máquina antes do install.sh do Chatwoot (CCV2-39). Roda no primeiro boot de
          # cada máquina, inclusive de uma recriada a partir de um snapshot, por isso pode encontrar
          # tudo já feito. Log em /var/log/cloud-init-output.log.
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Swap de 4 GB contra picos de memória (o install.sh compila os assets com até 4 GB).
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Recomendações do Redis.
          printf 'net.core.somaxconn = 1024\nvm.overcommit_memory = 1\n' > /etc/sysctl.d/90-chatclean.conf
          sysctl --system

          # AWS CLI v2 (S3, Parameter Store e SNS nos scripts de /opt/chatclean).
          apt-get update
          apt-get install -y ca-certificates curl unzip
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --update
          rm -rf /tmp/aws /tmp/awscliv2.zip

          # O AMI Ubuntu traz o SSM Agent (snap); garante que sobe no boot.
          snap start --enable amazon-ssm-agent

          # Scripts e logos da ChatClean, publicados pelo push-ops (ver .chatclean/deploy).
          install -m 0700 -d /opt/chatclean

          # CloudWatch Agent: memória e disco da máquina, e o log de acesso HTTPS do nginx que o
          # install.sh configura, para o alarme de erros 5xx.
          curl -fsSL https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb \
            -o /tmp/amazon-cloudwatch-agent.deb
          dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
          rm -f /tmp/amazon-cloudwatch-agent.deb
          cat > /opt/aws/amazon-cloudwatch-agent/etc/chatclean.json <<'JSON'
          {
            "agent": { "run_as_user": "root" },
            "metrics": {
              "namespace": "ChatClean",
              "append_dimensions": { "InstanceId": "${aws:InstanceId}" },
              "aggregation_dimensions": [["InstanceId"]],
              "metrics_collected": {
                "mem": { "measurement": ["mem_used_percent"] },
                "disk": { "resources": ["/"], "measurement": ["used_percent"], "drop_device": true }
              }
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    { "file_path": "/var/log/nginx/chatwoot_access_443.log", "log_group_name": "/chatclean/nginx",
                      "log_stream_name": "{instance_id}", "retention_in_days": 30 }
                  ]
                }
              }
            }
          }
          JSON
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/chatclean.json

  ElasticIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: chatclean-production }]

  # Anexos das conversas. Privado; o Rails entrega por URL pré-assinada de validade curta.
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub chatclean-attachments-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  # Dumps diários do banco em database/ (backup-db, apagados depois de 30 dias) e, em ops/, os
  # scripts e logos que a máquina baixa no setup.
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub chatclean-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expira-dumps
            Status: Enabled
            Prefix: database/
            ExpirationInDays: 30

  # Snapshot diário do disco da máquina às 06:30 UTC (03:30 de Brasília), guardando os 7 últimos.
  SnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chatclean-snapshots
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: dlm.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDataLifecycleManagerServiceRole

  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Properties:
      Description: ChatClean - snapshot diario do disco - 7 dias
      State: ENABLED
      ExecutionRoleArn: !GetAtt SnapshotRole.Arn
      PolicyDetails:
        ResourceTypes: [INSTANCE]
        TargetTags: [{ Key: Name, Value: chatclean-production }]
        Schedules:
          - Name: diario
            CreateRule: { Interval: 24, IntervalUnit: HOURS, Times: ['06:30'] }
            RetainRule: { Count: 7 }
            CopyTags: true

  # Alertas por e-mail. A assinatura precisa ser confirmada no link que a AWS manda.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: chatclean-alerts
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlertEmail }

  # E-mail transacional. O domínio é verificado por DKIM (3 CNAMEs) e o MAIL FROM
  # bounce.<domínio> tem SPF próprio, então o SPF da raiz (e-mail da Hostinger) não muda.
  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref MailDomain
      DkimSigningAttributes: { NextSigningKeyLength: RSA_2048_BIT }
      MailFromAttributes:
        MailFromDomain: !Sub bounce.${MailDomain}
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # Usuário só para as credenciais SMTP do SES, a única chave fixa do sistema (o Chatwoot envia
  # por SMTP). A chave é criada pelo ses-smtp-credentials direto no Parameter Store.
  SmtpUser:
    Type: AWS::IAM::User
    Properties:
      UserName: chatclean-ses-smtp
      Policies:
        - PolicyName: chatclean-ses-send
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomain}

  # Log de acesso HTTPS do nginx, enviado pelo CloudWatch Agent. Tem IP e URL de quem acessa: 30 dias.
  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /chatclean/nginx
      RetentionInDays: 30

  # Formato combined do nginx: ip - usuário [data] "pedido" status bytes "referer" "agente".
  Http5xxMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NginxLogGroup
      FilterPattern: '[ip, ident, user, timestamp, request, status_code >= 500, ...]'
      MetricTransformations:
        - { MetricNamespace: ChatClean, MetricName: Http5xx, MetricValue: '1', DefaultValue: 0 }

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-http-5xx
      AlarmDescription: Mais de 20 respostas 5xx em 5 minutos
      Namespace: ChatClean
      MetricName: Http5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-cpu
      AlarmDescription: CPU acima de 85% por 10 minutos
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-memoria
      AlarmDescription: Memória acima de 90% por 10 minutos
      Namespace: ChatClean
      MetricName: mem_used_percent
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-disco
      AlarmDescription: Disco acima de 80%
      Namespace: ChatClean
      MetricName: disk_used_percent
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Falha do hardware da AWS: a máquina é recuperada em outro host, com o mesmo disco e IP.
  SystemCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-maquina-recuperada
      AlarmDescription: Falha no host da AWS; a máquina foi recuperada automaticamente
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Sub arn:aws:automate:${AWS::Region}:ec2:recover
        - !Ref AlertsTopic

  # Falha dentro da máquina (sistema travado, sem memória): alerta para alguém olhar.
  InstanceCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: chatclean-maquina-sem-resposta
      AlarmDescription: A máquina não responde à verificação de status da AWS
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Gasto bruto, sem descontar os créditos: mostra o consumo real mesmo com a conta coberta.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: chatclean-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudget, Unit: USD }
        CostTypes: { IncludeCredit: false, IncludeRefund: false }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 85, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  InstanceId:
    Description: Alvo do aws ssm start-session e do push-ops
    Value: !Ref Instance
  PublicIp:
    Description: Registro A de chat.chatclean.com.br na Hostinger
    Value: !Ref ElasticIp
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  BackupsBucketName:
    Value: !Ref BackupsBucket
  DkimRecord1:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName1} -> ${MailIdentity.DkimDNSTokenValue1}
  DkimRecord2:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName2} -> ${MailIdentity.DkimDNSTokenValue2}
  DkimRecord3:
    Description: CNAME na Hostinger (nome -> valor)
    Value: !Sub ${MailIdentity.DkimDNSTokenName3} -> ${MailIdentity.DkimDNSTokenValue3}
