# Deploy do ChatClean em produção (CCV2-20).
#
# Desligado até a infraestrutura existir: só roda com a variável de repositório
# CHATCLEAN_DEPLOY_ENABLED=true. A stack de .chatclean/infra (CCV2-19) cria a máquina e dá os
# valores das variáveis AWS_DEPLOY_ROLE_ARN (role assumida por OIDC, sem chave fixa) e
# CHATCLEAN_INSTANCE_ID.
#
# O push na main só acontece por PR com o "CI ok" verde (ruleset), então o deploy parte
# de código já testado.
name: ChatClean Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chatclean-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1

jobs:
  deploy:
    name: Imagem MIT e deploy
    if: vars.CHATCLEAN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Edição MIT: o código de enterprise/ só pode rodar em produção com licença (CCV2-18).
      - name: Remove o código Enterprise
        run: |
          rm -rf enterprise spec/enterprise
          printf '\nENV CW_EDITION="ce"\n' >> docker/Dockerfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Monta, confere e publica a imagem
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image="$REGISTRY/chatclean:$GITHUB_SHA"
          docker build --file docker/Dockerfile --tag "$image" .
          if docker run --rm --entrypoint sh "$image" -c 'test -e /app/enterprise'; then
            echo "A imagem contém enterprise/." >&2
            exit 1
          fi
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Sem SSH: o deploy roda na máquina pelo SSM Run Command. O release.sh vem da própria imagem,
      # então a máquina só precisa da pasta /opt/chatclean (ver .chatclean/deploy e .chatclean/infra).
      - name: Deploy na máquina
        env:
          INSTANCE_ID: ${{ vars.CHATCLEAN_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          parameters=$(jq -n --arg image "$IMAGE" --arg registry "$REGISTRY" --arg region "$AWS_REGION" '{commands: [
            "set -eu",
            "cd /opt/chatclean",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
            "docker run --rm --entrypoint cat \($image) /app/.chatclean/deploy/release.sh > release.sh",
            "bash release.sh \($image)"
          ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 15 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status do deploy: $status"
          [ "$status" = "Success" ]
