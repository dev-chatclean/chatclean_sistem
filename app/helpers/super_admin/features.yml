# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Premium Features ------- #
saml:
  name: 'SAML SSO'
  description: 'Configuração do login único (SAML SSO)'
  enabled: <%= ChatwootApp.enterprise? %>
  icon: 'i-lucide-key-round'
  config_key: 'saml'
  enterprise: true
custom_branding:
  name: 'Marca própria'
  description: 'Aplica a sua própria marca nesta instalação.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'i-lucide-palette'
  config_key: 'custom_branding'
  enterprise: true
agent_capacity:
  name: 'Capacidade dos atendentes'
  description: 'Define limites para a atribuição automática de conversas aos atendentes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'i-lucide-gauge'
  enterprise: true
audit_logs:
  name: 'Registros de auditoria'
  description: 'Acompanhe as atividades da conta com registros de auditoria detalhados.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'i-lucide-scroll-text'
  enterprise: true
disable_branding:
  name: 'Tirar a marca'
  description: 'Tira a marca do widget de chat e dos e-mails externos.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'i-lucide-eye-off'
  enterprise: true
voice_calls:
  name: 'Chamadas de voz'
  description: 'Liga as chamadas de voz entre atendentes e clientes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'i-lucide-phone-call'
  enterprise: true

# ------- Product Features ------- #
help_center:
  name: 'Central de ajuda'
  description: 'Permite que os atendentes criem artigos e publiquem num portal de ajuda.'
  enabled: true
  icon: 'i-lucide-book-open'
captain:
  name: 'IA'
  description: 'Liga as conversas com IA para os clientes.'
  enabled: true
  icon: 'i-woot-captain text-n-violet-9'
  config_key: 'captain'

# ------- Communication Channels ------- #
live_chat:
  name: 'Chat ao vivo'
  description: 'Melhore o atendimento com um chat ao vivo no seu site.'
  enabled: true
  icon: 'i-lucide-message-circle'
email:
  name: 'E-mail'
  description: 'Atenda os clientes por e-mail.'
  enabled: true
  icon: 'i-lucide-mail'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'Atenda os clientes por SMS.'
  enabled: true
  icon: 'i-lucide-message-square-text'
messenger:
  name: 'Messenger'
  description: 'Fale com os clientes pelo Facebook e pelo Instagram.'
  enabled: true
  icon: 'i-logos-messenger'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Fale com os clientes pelo Instagram'
  enabled: true
  icon: 'i-logos-instagram-icon dark:invert'
  config_key: 'instagram'
tiktok:
  name: 'TikTok'
  description: 'Fale com os clientes pelo TikTok'
  enabled: true
  icon: 'i-logos-tiktok-icon dark:invert'
  config_key: 'tiktok'
whatsapp:
  name: 'WhatsApp'
  description: 'Atenda os clientes pelo WhatsApp Business.'
  enabled: true
  icon: 'i-logos-whatsapp-icon'
telegram:
  name: 'Telegram'
  description: 'Atenda os clientes pelo Telegram.'
  enabled: true
  icon: 'i-logos-telegram'
line:
  name: 'Line'
  description: 'Atenda os clientes pelo Line.'
  enabled: true
  icon: 'i-ri-line-fill text-[#06C755]'

# ------- OAuth & Authentication ------- #
google:
  name: 'Google'
  description: 'Configuração da integração com o Google (OAuth)'
  enabled: true
  icon: 'i-logos-google-icon'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Configuração do e-mail da Microsoft'
  enabled: true
  icon: 'i-logos-microsoft-icon'
  config_key: 'microsoft'

# ------- Third-party Integrations ------- #
stripe:
  name: 'Stripe'
  description: 'Configuração da integração de cobrança com a Stripe'
  enabled: true
  icon: 'i-woot-stripe-color'
  config_key: 'stripe'
linear:
  name: 'Linear'
  description: 'Configuração da integração com o Linear'
  enabled: true
  icon: 'i-logos-linear-icon dark:invert'
  config_key: 'linear'
notion:
  name: 'Notion'
  description: 'Configuração da integração com o Notion'
  enabled: true
  icon: 'i-logos-notion-icon dark:invert'
  config_key: 'notion'
slack:
  name: 'Slack'
  description: 'Configuração da integração com o Slack'
  enabled: true
  icon: 'i-logos-slack-icon'
  config_key: 'slack'
whatsapp_embedded:
  name: 'WhatsApp integrado'
  description: 'Configuração do cadastro integrado do WhatsApp'
  enabled: true
  icon: 'i-logos-whatsapp-icon'
  config_key: 'whatsapp_embedded'
shopify:
  name: 'Shopify'
  description: 'Configuração da integração com a Shopify'
  enabled: true
  icon: 'i-logos-shopify'
  config_key: 'shopify'
